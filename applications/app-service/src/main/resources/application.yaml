server:
  port: 8080
spring:
  application:
    name: "cy-auth"
  devtools:
    add-properties: false
  h2:
    console:
      enabled: true
      path: "/h2"
  profiles:
    include: null
adapters:
  r2dbc:
    host: ${DB_HOST}
    port: ${DB_PORT}
    database: ${MYSQL_DATABASE}
    schema: ${DB_SCHEMA}
    username: ${MYSQL_USER}
    password: ${MYSQL_PASSWORD}

management:
  endpoints:
    web:
      exposure:
        include: "health,prometheus"
  endpoint:
    health:
      probes:
        enabled: true
cors:
  allowed-origins: "http://localhost:4200,http://localhost:8080"
